<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bancoz UI</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-container">
        <img src="../icone.png" alt="Bancoz Logo" class="logo">
        <h1 class="brand-title">Bancoz</h1>
      </div>
      
      <div class="info-panel">
        <div class="info-item">
          <span class="info-label">Versão</span>
          <span class="info-value" id="app-version">...</span>
        </div>
        <div class="info-item">
          <span class="info-label">Pasta</span>
          <span class="info-value path-value" id="app-path">...</span>
        </div>
      </div>

      <div class="collections-section">
        <h2 class="section-title">COLEÇÕES</h2>
        <ul id="collections-list" class="collections-list">
          <!-- Rendered via JS -->
          <li class="loading-item">Carregando...</li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <h2 id="current-collection-title" class="current-title">Selecione uma coleção</h2>
          <span id="current-mode-badge" class="badge hidden"></span>
        </div>
        <div class="top-bar-right">
          <input type="text" id="search-input" class="search-input" placeholder="Buscar chave ou valor..." disabled>
        </div>
      </header>

      <div id="data-container" class="data-container empty-state">
        <div class="empty-message">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="empty-icon"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
          <p>Nenhuma coleção selecionada</p>
        </div>
      </div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
